<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profession Management System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 0;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 45px;
    }

    .form-container {
      display: flex;
      gap: 30px;
      width: 100%;
      margin-bottom: 35px;
    }

    .input-group {
      flex: 1;
    }

    .input-group label {
      display: block;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .input-group input {
      width: 100%;
      height: 50px;
      border: 1px solid #fff;
      border-radius: 5px;
      background: transparent;
      color: #fff;
      padding: 0 15px;
      font-size: 17px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #aaa;
    }

    #addEmployee {
      width: 190px;
      padding: 13px 20px;
      background: #fff;
      color: #000;
      border: none;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    #addEmployee:hover {
      background: #e7e7e7;
    }

    #message {
      min-height: 25px;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .error {
      color: red;
    }

    .success {
      color: #2ecc71;
    }

    h2 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 30px;
    }

    #employeeCount {
      color: #aaa;
      font-size: 17px;
      margin-bottom: 20px;
    }

    .employee-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .employee-details {
      border: 1px solid #fff;
      border-radius: 8px;
      min-height: 55px;
      padding: 15px 20px;
      display: grid;
      grid-template-columns: 70px 1fr 1fr 100px;
      align-items: center;
      flex: 1;
      gap: 20px;
      font-size: 16px;
    }

    .delete-btn {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 25px;
      padding: 13px 25px;
      cursor: pointer;
      font-size: 15px;
      white-space: nowrap;
    }

    .delete-btn:hover {
      background: #ddd;
    }

    .empty-message {
      color: #777;
      font-size: 18px;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 35px 0;
      }

      .form-container {
        flex-direction: column;
        gap: 20px;
      }

      .employee-row {
        flex-direction: column;
        align-items: stretch;
      }

      .employee-details {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .delete-btn {
        width: 130px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>New Employees</h1>

    <div class="form-container">

      <div class="input-group">
        <label for="name">Enter Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter employee name"
        />
      </div>

      <div class="input-group">
        <label for="profession">Enter Profession</label>
        <input
          type="text"
          id="profession"
          placeholder="Enter profession"
        />
      </div>

      <div class="input-group">
        <label for="age">Enter Age</label>
        <input
          type="number"
          id="age"
          placeholder="Enter age"
          min="1"
        />
      </div>

    </div>

    <button id="addEmployee">Add User</button>

    <div id="message"></div>

    <h2>Added Employees</h2>

    <p id="employeeCount">You have 0 Employees.</p>

    <div id="employeeList"></div>

  </div>


  <script>

    // Array containing all added employees
    let employees = [];

    // Unique employee ID
    let nextId = 1;

    // Getting DOM elements
    const nameInput = document.getElementById("name");
    const professionInput = document.getElementById("profession");
    const ageInput = document.getElementById("age");

    const addEmployeeButton = document.getElementById("addEmployee");

    const message = document.getElementById("message");
    const employeeList = document.getElementById("employeeList");
    const employeeCount = document.getElementById("employeeCount");


    // Add Employee
    addEmployeeButton.addEventListener("click", function () {

      const name = nameInput.value.trim();
      const profession = professionInput.value.trim();
      const age = ageInput.value.trim();

      // Validation
      if (name === "" || profession === "" || age === "") {

        message.textContent =
          "Error : Please Make sure All the fields are filled before adding in an employee!";

        message.className = "error";

        return;
      }

      // Creating employee object
      const employee = {
        id: nextId,
        name: name,
        profession: profession,
        age: Number(age)
      };

      // Increment unique ID
      nextId++;

      // Add employee object into array
      employees.push(employee);

      // Success message
      message.textContent =
        "Success : Employee Added!";

      message.className = "success";

      // Clear form
      nameInput.value = "";
      professionInput.value = "";
      ageInput.value = "";

      // Update screen
      renderEmployees();
    });


    // Display employees
    function renderEmployees() {

      employeeList.innerHTML = "";

      employeeCount.textContent =
        `You have ${employees.length} ${
          employees.length === 1 ? "Employee" : "Employees"
        }.`;

      // Default zero employee view
      if (employees.length === 0) {

        employeeList.innerHTML =
          `<p class="empty-message">You have 0 Employees.</p>`;

        return;
      }

      // Mapping employee array
      employees.map(function (employee) {

        const employeeRow = document.createElement("div");
        employeeRow.className = "employee-row";

        employeeRow.innerHTML = `
          <div class="employee-details">
            <span>${employee.id}.</span>

            <span>
              Name : ${escapeHTML(employee.name)}
            </span>

            <span>
              Profession : ${escapeHTML(employee.profession)}
            </span>

            <span>
              Age : ${employee.age}
            </span>
          </div>

          <button
            class="delete-btn"
            data-id="${employee.id}">
            Delete User
          </button>
        `;

        employeeList.appendChild(employeeRow);
      });


      // Delete buttons
      const deleteButtons =
        document.querySelectorAll(".delete-btn");

      deleteButtons.forEach(function (button) {

        button.addEventListener("click", function () {

          const employeeId =
            Number(this.getAttribute("data-id"));

          deleteEmployee(employeeId);
        });

      });
    }


    // Delete Employee
    function deleteEmployee(id) {

      employees = employees.filter(function (employee) {
        return employee.id !== id;
      });

      renderEmployees();
    }


    // Prevent unwanted HTML from user input
    function escapeHTML(value) {

      const div = document.createElement("div");

      div.textContent = value;

      return div.innerHTML;
    }


    // Initial/default display
    renderEmployees();

  </script>

</body>
</html>
